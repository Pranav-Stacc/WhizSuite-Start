# One-time workflow: add this file to Pranav-stac/WhizSuite-Start as
# .github/workflows/migrate-secrets-to-pranav-stacc.yml
#
# Prerequisites on OLD repo (Pranav-stac/WhizSuite-Start):
#   1. Settings → Secrets → Actions → New secret: DEST_REPO_PAT
#      Fine-grained PAT on Pranav-Stacc with Contents + Secrets read/write on WhizSuite-Start
#   2. Actions → Run workflow → confirm: MIGRATE
#
# Deletes this workflow from the old repo after a successful run.

name: Migrate secrets to Pranav-Stacc

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MIGRATE to copy all mobile CI secrets to Pranav-Stacc/WhizSuite-Start
        required: true

permissions:
  contents: read

jobs:
  migrate:
    if: github.event.inputs.confirm == 'MIGRATE'
    runs-on: ubuntu-latest
    steps:
      - name: Copy repository secrets
        env:
          GH_TOKEN: ${{ secrets.DEST_REPO_PAT }}
          DEST: Pranav-Stacc/WhizSuite-Start
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPLE_APP_IDENTIFIER: ${{ secrets.APPLE_APP_IDENTIFIER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_KEY_BASE64 }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          MATCH_GIT_API_AUTH: ${{ secrets.MATCH_GIT_API_AUTH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_KEYCHAIN_NAME: ${{ secrets.MATCH_KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          copy() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "skip $name (empty)"
              return
            fi
            printf '%s' "$value" | gh secret set "$name" -R "$DEST"
            echo "set $name"
          }
          copy ANDROID_KEYSTORE_BASE64 "$ANDROID_KEYSTORE_BASE64"
          copy ANDROID_KEYSTORE_PASSWORD "$ANDROID_KEYSTORE_PASSWORD"
          copy ANDROID_KEY_ALIAS "$ANDROID_KEY_ALIAS"
          copy ANDROID_KEY_PASSWORD "$ANDROID_KEY_PASSWORD"
          copy APPLE_APP_IDENTIFIER "$APPLE_APP_IDENTIFIER"
          copy APPLE_TEAM_ID "$APPLE_TEAM_ID"
          copy APPSTORE_CONNECT_ISSUER_ID "$APPSTORE_CONNECT_ISSUER_ID"
          copy APPSTORE_CONNECT_KEY_BASE64 "$APPSTORE_CONNECT_KEY_BASE64"
          copy APPSTORE_CONNECT_KEY_ID "$APPSTORE_CONNECT_KEY_ID"
          copy FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD "$FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD"
          copy GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64"
          copy IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"
          copy MATCH_GIT_API_AUTH "$MATCH_GIT_API_AUTH"
          copy MATCH_GIT_URL "$MATCH_GIT_URL"
          copy MATCH_KEYCHAIN_NAME "$MATCH_KEYCHAIN_NAME"
          copy MATCH_KEYCHAIN_PASSWORD "$MATCH_KEYCHAIN_PASSWORD"
          copy MATCH_PASSWORD "$MATCH_PASSWORD"
          echo "Done. Verify: gh secret list -R $DEST"
