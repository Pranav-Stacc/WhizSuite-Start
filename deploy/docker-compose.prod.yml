name: whizsuite

x-api: &api
  image: ${API_IMAGE_REPO:?}:${API_IMAGE_TAG:?}
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    command: >
      postgres -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      -c work_mem=${POSTGRES_WORK_MEM:-4MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-96mb}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

  api:
    <<: *api
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + (process.env.PORT || 3001) + '/' + (process.env.API_PREFIX || 'api') + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_started

  agent:
    image: ${AGENT_IMAGE_REPO:?}:${AGENT_IMAGE_TAG:?}
    env_file: .env
    environment:
      API_BASE_URL: http://api:3001/${API_PREFIX:-api}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    <<: *api
    restart: 'no'
    profiles: ['ops']
    command: ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && node_modules/.bin/tsx prisma/seed.ts']

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
