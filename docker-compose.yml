services:
  postgres:
    image: postgres:16-alpine
    container_name: agency-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency_dev_password
      POSTGRES_DB: agency_os
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agency -d agency_os']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agency-os-redis
    restart: unless-stopped
    # Host 6380 avoids Windows' legacy Redis 3.x service on 6379 (BullMQ needs Redis 5+).
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: agency-os-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: agency-os-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

  agent:
    image: python:3.12-slim
    container_name: agency-os-agent
    working_dir: /app
    volumes:
      - ./apps/agent:/app
    command: sh -c "pip install -q -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      API_BASE_URL: http://host.docker.internal:3001/api
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
    ports:
      - '8000:8000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
  redis_data:
  minio_data:
