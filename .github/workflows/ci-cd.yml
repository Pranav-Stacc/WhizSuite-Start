name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'apps/agent/**'
              - 'packages/**'
              - 'deploy/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci-cd.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'amplify.yml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci-cd.yml'

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agency-os/api exec prisma generate
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Unit tests
        run: pnpm --filter @agency-os/api exec jest --passWithNoTests
      - name: Build
        run: pnpm turbo run build
        env:
          SESSION_SECRET: ci-build-only-session-secret
      # Prettier/eslint debt on main currently blocks deploy; keep signal without gating.
      - name: Lint API
        continue-on-error: true
        run: pnpm --filter @agency-os/api exec eslint "{src,test}/**/*.ts"

  deploy-api:
    needs: [changes, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
        with:
          # Avoid pulling moby/buildkit from Docker Hub (flaky/rate-limited on GHA).
          driver: docker
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: apps/agent
          file: apps/agent/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/whizsuite-agent:${{ github.sha }}
      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ vars.EC2_APP_DIR }}
          SHA: ${{ github.sha }}
        run: |
          script="cd $APP_DIR && git fetch --quiet origin && git checkout --quiet --force --detach $SHA && deploy/deploy.sh $SHA"
          params=$(jq -n --arg c "runuser -u ubuntu -- bash -lc '$script'" '{commands: [$c]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${SHA:0:7}" --timeout-seconds 900 --parameters "$params" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = "Success"

  deploy-web:
    needs: [changes, verify, deploy-api]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.verify.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.deploy-api.result)
      && (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and deploy on Amplify
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH: ${{ vars.AMPLIFY_BRANCH }}
          SHA: ${{ github.sha }}
        run: |
          job=$(aws amplify start-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-type RELEASE \
            --commit-id "$SHA" --query jobSummary.jobId --output text)
          echo "Amplify job $job"
          for _ in $(seq 1 120); do
            status=$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$job" --query job.summary.status --output text)
            case "$status" in PENDING|PROVISIONING|RUNNING) sleep 15 ;; *) break ;; esac
          done
          echo "Amplify job status: $status"
          test "$status" = "SUCCEED"
