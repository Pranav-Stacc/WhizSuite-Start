name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_api:
        description: Force API/agent deploy even if paths unchanged
        type: boolean
        default: false
      force_ios:
        description: Force iOS App Store publish even if mobile/version unchanged
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      mobile_version: ${{ steps.filter.outputs.mobile_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'apps/agent/**'
              - 'packages/**'
              - 'deploy/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/publish-ios-app-store.yml'
            mobile_version:
              - 'apps/mobile/pubspec.yaml'

  # Backend / shared packages only — web builds on Amplify automatically.
  verify:
    needs: [changes]
    if: >-
      needs.changes.outputs.api == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.force_api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agency-os/api exec prisma generate
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Unit tests
        run: pnpm --filter @agency-os/api exec jest --passWithNoTests
      - name: Build
        run: pnpm turbo run build
        env:
          SESSION_SECRET: ci-build-only-session-secret
      - name: Lint API
        continue-on-error: true
        run: pnpm --filter @agency-os/api exec eslint "{src,test}/**/*.ts"

  deploy-api:
    needs: [changes, verify]
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.verify.result == 'success'
      && (
        needs.changes.outputs.api == 'true'
        || (github.event_name == 'workflow_dispatch' && inputs.force_api)
      )
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: apps/agent
          file: apps/agent/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/whizsuite-agent:${{ github.sha }}
      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ vars.EC2_APP_DIR }}
          SHA: ${{ github.sha }}
        run: |
          script="cd $APP_DIR && git fetch --quiet origin && git checkout --quiet --force --detach $SHA && deploy/deploy.sh $SHA"
          params=$(jq -n --arg c "runuser -u ubuntu -- bash -lc '$script'" '{commands: [$c]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${SHA:0:7}" --timeout-seconds 900 --parameters "$params" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = "Success"

  # iOS only when mobile code changed AND pubspec version bumped. No backend deploy.
  # Web is not deployed here — Amplify auto-builds on push.
  deploy-ios:
    needs: [changes]
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && (
        (needs.changes.outputs.mobile == 'true' && needs.changes.outputs.mobile_version == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.force_ios)
      )
    uses: ./.github/workflows/publish-ios-app-store.yml
    with:
      track: beta
      bootstrap_certs: false
    secrets: inherit
