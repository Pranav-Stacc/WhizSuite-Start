name: Ops AWS

# One-shot production ops using the GitHub OIDC deploy role (no local AWS login needed).
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to configure
        required: true
        type: choice
        options:
          - cors
          - amplify-domain
          - both

permissions:
  contents: read
  id-token: write

jobs:
  ops:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Patch API CORS / WEB_APP_URL on EC2
        if: inputs.action == 'cors' || inputs.action == 'both'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ vars.EC2_APP_DIR }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          script="cd $APP_DIR && git fetch --quiet origin && git checkout --quiet --force --detach $SHA && bash deploy/ops-update-cors.sh"
          params=$(jq -n --arg c "runuser -u ubuntu -- bash -lc $(jq -nr --arg s "$script" '$s|@sh')" '{commands:[$c]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "ops-cors ${SHA:0:7}" --timeout-seconds 300 --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          test "$status" = "Success"

      - name: Attach whizsuite.com to Amplify
        if: inputs.action == 'amplify-domain' || inputs.action == 'both'
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          # Apex + www + wildcard (*) — required for test/crm-test agency hosts (ADR 0009).
          subdomain_settings="prefix=,branchName=$BRANCH prefix=www,branchName=$BRANCH prefix=*,branchName=$BRANCH"

          existing=$(aws amplify list-domain-associations --app-id "$APP_ID" \
            --query "domainAssociations[?domainName=='whizsuite.com'].domainName" --output text)
          if [[ -n "$existing" ]]; then
            echo "Updating whizsuite.com (ensure apex, www, and wildcard subdomains)..."
            aws amplify update-domain-association \
              --app-id "$APP_ID" \
              --domain-name whizsuite.com \
              --sub-domain-settings $subdomain_settings
          else
            aws amplify create-domain-association \
              --app-id "$APP_ID" \
              --domain-name whizsuite.com \
              --sub-domain-settings $subdomain_settings
          fi

          echo "Waiting for domain association to finish updating..."
          for _ in $(seq 1 60); do
            status=$(aws amplify get-domain-association --app-id "$APP_ID" --domain-name whizsuite.com \
              --query 'domainAssociation.domainStatus' --output text)
            update=$(aws amplify get-domain-association --app-id "$APP_ID" --domain-name whizsuite.com \
              --query 'domainAssociation.updateStatus' --output text)
            echo "domainStatus=$status updateStatus=${update:-none}"
            if [[ "$status" == "AVAILABLE" && ( -z "$update" || "$update" == "UPDATE_COMPLETE" || "$update" == "None" ) ]]; then
              break
            fi
            if [[ "$status" == "FAILED" || "$update" == "UPDATE_FAILED" ]]; then
              aws amplify get-domain-association --app-id "$APP_ID" --domain-name whizsuite.com
              exit 1
            fi
            sleep 15
          done

          # Merge required env vars without wiping others.
          current=$(aws amplify get-app --app-id "$APP_ID" --query 'app.environmentVariables' --output json)
          merged=$(jq -n --argjson cur "${current:-{}}" '
            $cur * {
              API_BASE_URL: "https://api.whizsuite.com/api",
              APP_ROOT_DOMAIN: "whizsuite.com",
              NEXT_PUBLIC_APP_ROOT_DOMAIN: "whizsuite.com",
              SESSION_COOKIE_DOMAIN: ".whizsuite.com",
              SESSION_COOKIE_SECURE: "true",
              NEXT_PUBLIC_APP_NAME: "WhizSuite"
            }')
          aws amplify update-app --app-id "$APP_ID" --environment-variables "$merged"

          echo "DNS records Amplify expects:"
          aws amplify get-domain-association --app-id "$APP_ID" --domain-name whizsuite.com \
            --query 'domainAssociation.{status:domainStatus,subDomains:subDomains,certificate:certificateVerificationDNSRecord}'
