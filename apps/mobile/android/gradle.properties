org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Pub cache is on C: while the project is on E:; Kotlin incremental compile cannot
# relativize paths across Windows drive roots (android_file_picker / file_picker).
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.android=false

org.gradle.workers.max=2
org.gradle.parallel=false

