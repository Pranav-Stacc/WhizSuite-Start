name: agency_os
description: WhizSuite mobile app for agency staff and client portal users.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  # 7.3.2+ needs dbus 0.8, which conflicts with flutter_local_notifications' Linux plugin.
  connectivity_plus: ">=6.1.0 <7.3.2"
  dio: ^5.11.1
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
